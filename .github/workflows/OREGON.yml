name: Oregon Public Notice PDF Processor

on:
  workflow_dispatch:
    inputs:
      start_row:
        description: "Row number to start processing from"
        required: true
        default: "2"
        type: string

      overwrite_existing:
        description: "Overwrite existing values in columns E:G"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: oregon-public-notice-pdf-processor
  cancel-in-progress: false

jobs:
  process-pdf-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      SHEET_ID: "1iXOEgk_jYxeykjXafgCSc80KkAn-Jp2jl27ZS7FqGdg"
      WORKSHEET_NAME: "Notice of LP"
      START_ROW: ${{ inputs.start_row }}
      PDF_TIMEOUT_MS: "120000"
      REQUEST_DELAY_MS: "1500"
      MAX_RETRIES: "3"
      GOOGLE_APPLICATION_CREDENTIALS: "service-account.json"
      OVERWRITE_EXISTING: ${{ inputs.overwrite_existing }}

    steps:
      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================================
      # SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      # ==========================================
      # VALIDATE WORKFLOW INPUTS
      # ==========================================
      - name: Validate Start Row
        shell: bash
        run: |
          set -euo pipefail

          if ! [[ "$START_ROW" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Start row must be a whole number. Received: $START_ROW"
            exit 1
          fi

          if [ "$START_ROW" -lt 2 ]; then
            echo "ERROR: Start row must be 2 or greater. Received: $START_ROW"
            exit 1
          fi

          echo "Processing will begin at worksheet row $START_ROW."

      # ==========================================
      # INSTALL NODE DEPENDENCIES
      # ==========================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json

          # npm install works whether or not package-lock.json already exists
          # and synchronizes the lock file with newly added dependencies.
          npm install

          npm list googleapis --depth=0
          npm list pdf-parse --depth=0

      # ==========================================
      # VERIFY SCRAPER EXISTS
      # ==========================================
      - name: Verify Scraper Script
        shell: bash
        run: |
          set -euo pipefail

          ls -la
          test -f scraper.cjs
          node --check scraper.cjs

      # ==========================================
      # WRITE GOOGLE SERVICE ACCOUNT JSON
      # ==========================================
      - name: Write Service Account JSON
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ERROR: GitHub secret SERVICE_ACCOUNT_JSON is empty or missing."
            exit 1
          fi

          printf '%s' "$SERVICE_ACCOUNT_JSON" > service-account.json
          chmod 600 service-account.json

      # ==========================================
      # VALIDATE GOOGLE SERVICE ACCOUNT JSON
      # ==========================================
      - name: Validate Service Account JSON
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const file = 'service-account.json';
          const credentials = JSON.parse(
            fs.readFileSync(file, 'utf8')
          );

          const required = [
            'type',
            'project_id',
            'private_key',
            'client_email',
            'token_uri'
          ];

          const missing = required.filter(
            key => !credentials[key]
          );

          if (missing.length > 0) {
            throw new Error(
              `Service account JSON is missing: ${missing.join(', ')}`
            );
          }

          if (credentials.type !== 'service_account') {
            throw new Error(
              'Credential type must be service_account.'
            );
          }

          console.log('====================================');
          console.log('Google Service Account Loaded OK');
          console.log('Client Email:', credentials.client_email);
          console.log('Project ID:', credentials.project_id);
          console.log('====================================');
          NODE

      # ==========================================
      # RUN PDF PROCESSOR
      #
      # Column D = source PDF URL
      # Column E = Case / Instrument Number
      # Column F = Defendant / Grantor
      # Column G = Subject Property
      #
      # Processing begins at the row supplied through
      # the workflow_dispatch start_row input.
      # ==========================================
      - name: Process PDF Notices
        shell: bash
        run: |
          set -euo pipefail

          echo "Worksheet: $WORKSHEET_NAME"
          echo "Starting row: $START_ROW"
          echo "Source range: D${START_ROW}:D"
          echo "Output range: E${START_ROW}:G"
          echo "Overwrite existing: $OVERWRITE_EXISTING"

          node scraper.cjs

      # ==========================================
      # VERIFY PROCESSOR OUTPUT
      # ==========================================
      - name: Verify Processor Output
        if: always()
        shell: bash
        run: |
          echo "=== Generated Files ==="
          ls -la

          if [ -f pdf-extraction-results.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('pdf-extraction-results.json', 'utf8')); console.log('Results JSON is readable.')"
          fi

          if [ -f pdf-extraction-failures.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('pdf-extraction-failures.json', 'utf8')); console.log('Failures JSON is readable.')"
          fi

      # ==========================================
      # UPLOAD PROCESSING RESULTS
      # ==========================================
      - name: Upload Processing Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-processing-results-row-${{ inputs.start_row }}
          path: |
            pdf-extraction-results.json
            pdf-extraction-failures.json
          if-no-files-found: ignore
          retention-days: 14

      # ==========================================
      # CLEANUP TEMPORARY CREDENTIALS
      # ==========================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f service-account.json
