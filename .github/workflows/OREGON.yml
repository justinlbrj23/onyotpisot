name: Oregon Public Notice Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          npm install playwright

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run Scraper
        run: node scraper.cjs

      - name: Upload Scraper Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: |
            *.csv
            *.json
            *.txt

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            page.html
            page.png
            debug-page.html
            debug-page.png
            after-search.html
            element-ids.json

      - name: List Generated Files
        if: always()
        run: |
          echo "=== Generated Files ==="
          find . -type f | sort

      - name: Cleanup
        if: always()
        run: |
          rm -f page.html
          rm -f page.png
          rm -f debug-page.html
          rm -f debug-page.png
          rm -f after-search.html
          rm -f element-ids.json
