name: Oregon Public Notice Scraper

on:
  workflow_dispatch:

jobs:
  scrape-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      START_URL: "https://www.publicnoticeoregon.com/(S(b13eg0ew25gdpkwpknkphdvy))/Search.aspx"
      SHEET_ID: "1iXOEgk_jYxeykjXafgCSc80KkAn-Jp2jl27ZS7FqGdg"
      WORKSHEET_NAME: "Notice of LP"

    steps:
      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v5

      # ==========================================
      # SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      # ==========================================
      # INSTALL PLAYWRIGHT
      # ==========================================
      - name: Install Playwright
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            npm init -y
            npm install playwright
          fi

          if ! npm list playwright --depth=0 >/dev/null 2>&1; then
            npm install playwright
          fi

          npx playwright install chromium --with-deps

      # ==========================================
      # VERIFY SCRAPER EXISTS
      # ==========================================
      - name: Verify Scraper Script
        run: |
          ls -la
          test -f scraper.cjs
          node --check scraper.cjs

      # ==========================================
      # RUN SCRAPER
      # ==========================================
      - name: Run Scraper Script
        run: |
          node scraper.cjs

      # ==========================================
      # VERIFY SCRAPER OUTPUT
      # ==========================================
      - name: Verify Scraper Output
        run: |
          ls -la
          test -f notices.json
          test -f notices.txt

      # ==========================================
      # SETUP PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================
      # INSTALL GOOGLE SHEETS DEPENDENCIES
      # ==========================================
      - name: Install Google Sheets Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      # ==========================================
      # WRITE GOOGLE SERVICE ACCOUNT JSON
      # ==========================================
      - name: Write Service Account JSON
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > service-account.json

      # ==========================================
      # VALIDATE SERVICE ACCOUNT JSON
      # ==========================================
      - name: Validate Service Account JSON
        run: |
          python -c 'import json; j=json.load(open("service-account.json", encoding="utf-8")); required=["private_key","client_email","project_id"]; missing=[k for k in required if not j.get(k)]; assert not missing, f"Missing required fields: {missing}"; print("===================================="); print("Google Service Account Loaded OK"); print("Client Email:", j["client_email"]); print("Project ID:", j["project_id"]); print("====================================")'

      # ==========================================
      # APPEND NOTICES TO GOOGLE SHEETS
      #
      # caseNumber -> column E
      # text       -> column F
      # ==========================================
      - name: Append Notices to Probate Sheet
        run: |
          python -c 'import json,os,gspread; from google.oauth2.service_account import Credentials; notices=json.load(open("notices.json",encoding="utf-8")); scopes=["https://www.googleapis.com/auth/spreadsheets","https://www.googleapis.com/auth/drive"]; creds=Credentials.from_service_account_file("service-account.json",scopes=scopes); ws=gspread.authorize(creds).open_by_key(os.environ["SHEET_ID"]).worksheet(os.environ["WORKSHEET_NAME"]); existing={str(v).strip().upper() for v in ws.col_values(5)[1:] if str(v).strip()}; rows=[]; seen=set(); [(rows.append([case,text]),seen.add(case)) for n in notices if (case:=str(n.get("caseNumber","")).strip().upper()) and (text:=str(n.get("text","")).strip()) and case not in existing and case not in seen]; next_row=max(len(ws.col_values(5)),len(ws.col_values(6)),1)+1; end_row=next_row+len(rows)-1; ws.update(values=rows,range_name=f"E{next_row}:F{end_row}",value_input_option="RAW") if rows else None; print(f"Appended {len(rows)} new notice(s) to {ws.title}.")'

      # ==========================================
      # UPLOAD SCRAPER OUTPUT
      # ==========================================
      - name: Upload Scraper Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: |
            notices.json
            notices.txt
            page.html
            page.png
            final-page.png
          if-no-files-found: ignore

      # ==========================================
      # CLEANUP
      # ==========================================
      - name: Cleanup
        if: always()
        run: |
          rm -f service-account.json
