name: Oregon Public Notice Scraper

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oregon-public-notice-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      START_URL: "https://www.publicnoticeoregon.com/Search.aspx"
      SHEET_ID: "1iXOEgk_jYxeykjXafgCSc80KkAn-Jp2jl27ZS7FqGdg"
      WORKSHEET_NAME: "Probate"

    steps:
      # ==========================================
      # CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # ==========================================
      # INSTALL NODE DEPENDENCIES
      # ==========================================
      - name: Install Node Dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          if ! npm list playwright --depth=0 >/dev/null 2>&1; then
            npm install --no-save playwright
          fi

      # ==========================================
      # INSTALL CHROMIUM AND LINUX DEPENDENCIES
      # ==========================================
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ==========================================
      # RUN SCRAPER
      # scraper.cjs must generate notices.json
      # ==========================================
      - name: Run Scraper
        env:
          START_URL: ${{ env.START_URL }}
        run: node scraper.cjs

      # ==========================================
      # VALIDATE SCRAPER OUTPUT
      # ==========================================
      - name: Validate notices.json
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const outputFile = 'notices.json';

          if (!fs.existsSync(outputFile)) {
            throw new Error('scraper.cjs did not create notices.json');
          }

          const notices = JSON.parse(
            fs.readFileSync(outputFile, 'utf8')
          );

          if (!Array.isArray(notices)) {
            throw new Error('notices.json must contain a JSON array');
          }

          const invalid = [];

          notices.forEach((notice, index) => {
            const caseNumber = String(
              notice?.caseNumber ?? ''
            ).trim();

            const text = String(
              notice?.text ?? ''
            ).trim();

            if (!caseNumber || !text) {
              invalid.push(index + 1);
            }
          });

          if (invalid.length > 0) {
            throw new Error(
              'Missing caseNumber or text in notice indexes: ' +
              invalid.join(', ')
            );
          }

          console.log(`Validated ${notices.length} notice(s).`);
          NODE

      # ==========================================
      # SETUP PYTHON FOR GOOGLE SHEETS
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Google Sheets Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "gspread>=6,<7" "google-auth>=2,<3"

      # ==========================================
      # CREATE AND VALIDATE SERVICE ACCOUNT FILE
      # ==========================================
      - name: Write Google Service Account JSON
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("SERVICE_ACCOUNT_JSON", "").strip()

          if not raw:
              raise SystemExit(
                  "GitHub secret SERVICE_ACCOUNT_JSON is empty or missing"
              )

          try:
              credentials = json.loads(raw)
          except json.JSONDecodeError as error:
              raise SystemExit(
                  f"SERVICE_ACCOUNT_JSON is not valid JSON: {error}"
              )

          required_fields = (
              "type",
              "project_id",
              "private_key",
              "client_email",
              "token_uri",
          )

          missing = [
              field
              for field in required_fields
              if not credentials.get(field)
          ]

          if missing:
              raise SystemExit(
                  "Service account JSON is missing: " + ", ".join(missing)
              )

          Path("service-account.json").write_text(
              json.dumps(credentials),
              encoding="utf-8",
          )

          print("Google service account JSON validated successfully.")
          print("Client email:", credentials["client_email"])
          print("Project ID:", credentials["project_id"])
          PY

      # ==========================================
      # APPEND TO GOOGLE SHEETS
      # caseNumber -> column E
      # text       -> column F
      # Existing case numbers in E2:E are skipped.
      # ==========================================
      - name: Append Notices to Probate Sheet
        env:
          SHEET_ID: ${{ env.SHEET_ID }}
          WORKSHEET_NAME: ${{ env.WORKSHEET_NAME }}
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          import json
          import os

          import gspread
          from google.oauth2.service_account import Credentials

          sheet_id = os.environ["SHEET_ID"]
          worksheet_name = os.environ["WORKSHEET_NAME"]

          with open("notices.json", "r", encoding="utf-8") as file:
              notices = json.load(file)

          scopes = [
              "https://www.googleapis.com/auth/spreadsheets",
              "https://www.googleapis.com/auth/drive",
          ]

          credentials = Credentials.from_service_account_file(
              "service-account.json",
              scopes=scopes,
          )

          client = gspread.authorize(credentials)
          spreadsheet = client.open_by_key(sheet_id)
          worksheet = spreadsheet.worksheet(worksheet_name)

          # Existing values in E2:E are used to prevent duplicate cases.
          existing_case_numbers = {
              str(value).strip().upper()
              for value in worksheet.col_values(5)[1:]
              if str(value).strip()
          }

          rows_to_write = []
          seen_in_current_run = set()

          for notice in notices:
              case_number = str(
                  notice.get("caseNumber", "")
              ).strip().upper()

              text = str(
                  notice.get("text", "")
              ).strip()

              if not case_number or not text:
                  continue

              if case_number in existing_case_numbers:
                  print(f"Skipping existing case: {case_number}")
                  continue

              if case_number in seen_in_current_run:
                  print(f"Skipping duplicate in current run: {case_number}")
                  continue

              rows_to_write.append([case_number, text])
              seen_in_current_run.add(case_number)

          if not rows_to_write:
              print("No new notices to append to Google Sheets.")
              raise SystemExit(0)

          # Find the next row after the final used cell in either E or F.
          column_e = worksheet.col_values(5)
          column_f = worksheet.col_values(6)

          next_row = max(
              len(column_e),
              len(column_f),
              1,
          ) + 1

          next_row = max(next_row, 2)
          end_row = next_row + len(rows_to_write) - 1
          target_range = f"E{next_row}:F{end_row}"

          worksheet.update(
              range_name=target_range,
              values=rows_to_write,
              value_input_option="RAW",
          )

          print(
              f"Appended {len(rows_to_write)} new notice(s) to "
              f"'{worksheet_name}'!{target_range}."
          )
          PY

      # ==========================================
      # LIST FILES FOR DIAGNOSTICS
      # ==========================================
      - name: List Generated Files
        if: always()
        shell: bash
        run: |
          echo "=== Generated Files ==="
          find . -maxdepth 3 -type f | sort

      # ==========================================
      # UPLOAD SCRAPER OUTPUT
      # ==========================================
      - name: Upload Scraper Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-output
          path: |
            notices.json
            notices.txt
            *.csv
          if-no-files-found: ignore
          retention-days: 14

      # ==========================================
      # UPLOAD DEBUG FILES
      # ==========================================
      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            page.html
            page.png
            final-page.png
            debug-page.html
            debug-page.png
            after-search.html
            element-ids.json
          if-no-files-found: ignore
          retention-days: 14

      # ==========================================
      # REMOVE TEMPORARY CREDENTIALS
      # ==========================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f service-account.json
          rm -f page.html
          rm -f page.png
          rm -f final-page.png
          rm -f debug-page.html
          rm -f debug-page.png
          rm -f after-search.html
          rm -f element-ids.json
