name: Rockdale GA Scraper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Install Node dependencies
      - name: Install Node dependencies
        run: npm install

      # Install Playwright Chromium and Linux dependencies
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Verify required secrets
      - name: Verify required secrets
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::SERVICE_ACCOUNT_JSON secret is missing or empty."
            exit 1
          fi

          if [ -z "$SHEET_ID" ]; then
            echo "::error::SHEET_ID secret is missing or empty."
            exit 1
          fi

          echo "Required repository secrets are configured."

      # Run scraper
      - name: Run Save Page FCL scraper
        env:
          CI: "true"
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: node save_page.cjs
